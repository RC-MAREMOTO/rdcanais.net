<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AXN HD · Ao vivo</title>
<style>
  :root{
    --bg:#0f1720; --panel:#17212d; --line:#263444; --text:#e8eef4; --muted:#8a9aab;
    --accent:#4cb3ff; --live:#ef4b4b;
    color-scheme: dark;
  }
  *{box-sizing:border-box;margin:0}
  html{height:100%}
  body{min-height:100%}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
       padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
  header{width:100%;max-width:1100px;display:flex;align-items:center;gap:10px}
  header h1{font-size:1rem;font-weight:600;letter-spacing:.2px}
  .badge{display:inline-flex;align-items:center;gap:6px;background:var(--live);color:#fff;
         font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:4px}
  .badge i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.badge i{animation:none}}

  .player{position:relative;width:100%;max-width:1100px;aspect-ratio:16/9;background:#000;
          border-radius:10px;overflow:hidden;border:1px solid var(--line);user-select:none}
  .player:fullscreen{max-width:none;width:100%;height:100%;aspect-ratio:auto;border:0;border-radius:0}
  video{width:100%;height:100%;display:block;background:#000}

  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           flex-direction:column;gap:10px;text-align:center;padding:20px;pointer-events:none}
  .spinner{width:42px;height:42px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--accent);
           border-radius:50%;animation:spin .8s linear infinite;display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .player.loading .spinner{display:block}
  .msg{font-size:.9rem;color:var(--text);max-width:34ch;display:none;pointer-events:auto}
  .player.error .msg{display:block}
  .msg button{margin-top:10px}

  .unmute{position:absolute;top:12px;left:12px;background:rgba(15,23,32,.8);border:1px solid var(--line);
          padding:0 12px;height:34px;border-radius:17px;display:none}
  .unmute.show{display:inline-flex}
  .controls{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 10px;
            background:linear-gradient(transparent,rgba(0,0,0,.85));
            display:flex;align-items:center;gap:6px;transition:opacity .25s}
  .player.idle.playing .controls{opacity:0;pointer-events:none}
  .player.idle.playing{cursor:none}
  .spacer{flex:1}

  button{background:none;border:0;color:var(--text);cursor:pointer;border-radius:6px;
         min-width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;
         font:inherit;font-size:.82rem}
  button:hover{background:rgba(255,255,255,.12)}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .retry{background:var(--accent);color:#06121c;padding:0 16px;font-weight:600}
  .retry:hover{background:#7cc6ff}
  svg{width:22px;height:22px;fill:currentColor}

  input[type=range]{-webkit-appearance:none;appearance:none;width:84px;height:4px;border-radius:2px;
        background:linear-gradient(to right,var(--accent) var(--v,100%),rgba(255,255,255,.25) var(--v,100%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:0}
  select{background:rgba(255,255,255,.1);color:var(--text);border:0;border-radius:6px;height:32px;padding:0 6px;font:inherit;font-size:.82rem}
  select option{background:var(--panel)}
  .golive{font-size:.75rem;color:var(--muted);padding:0 10px}
  .golive.atlive{color:var(--live);font-weight:700}

  @media (max-width:560px){
    input[type=range]{width:64px}
    .golive{padding:0 4px}
    .controls{gap:2px;padding-left:6px;padding-right:6px}
    .hide-sm{display:none}
  }
  .castmsg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
           gap:12px;background:rgba(15,23,32,.92);text-align:center;padding:20px;font-size:.95rem;z-index:2}
  .player.casting .castmsg{display:flex}
  .player.casting .controls{z-index:3}
  .castmsg button{background:rgba(255,255,255,.12);padding:0 16px}
  #cast.on{color:var(--accent)}
  .nowbar{position:absolute;top:0;left:0;right:0;padding:12px 14px 26px;font-size:.85rem;
          background:linear-gradient(rgba(0,0,0,.75),transparent);display:none;transition:opacity .25s;pointer-events:none;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nowbar.show{display:block}
  .nowbar b{color:var(--accent);font-weight:700;margin-right:6px}
  .player.idle.playing .nowbar{opacity:0}

  .epg{width:100%;max-width:1100px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
  .epg[hidden]{display:none}
  .epg .tag{font-size:.7rem;font-weight:700;color:#06121c;background:var(--accent);padding:2px 7px;border-radius:4px}
  .epg h2{font-size:1.05rem;font-weight:600;margin:8px 0 2px}
  .epg .meta{color:var(--muted);font-size:.8rem}
  .epg .bar{height:4px;background:var(--line);border-radius:2px;margin:10px 0;overflow:hidden}
  .epg .bar i{display:block;height:100%;width:0;background:var(--accent)}
  .epg .desc{color:var(--muted);font-size:.85rem;line-height:1.45}
  .epg h3{font-size:.72rem;letter-spacing:.8px;color:var(--muted);margin:16px 0 6px;font-weight:700}
  .epg ul{list-style:none;padding:0}
  .epg li{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:.88rem}
  .epg li time{color:var(--muted);min-width:44px;font-variant-numeric:tabular-nums}
  .epg li.cur{color:var(--accent)}
  .epg li.cur time{color:var(--accent)}
  .epg .more{margin-top:8px;width:100%;background:rgba(255,255,255,.07);height:40px}
  .epg .err{color:var(--muted);font-size:.85rem}
  @media (max-width:560px){ select{padding:0 2px;font-size:.75rem} }
</style>
</head>
<body>

<header>
  <span class="badge"><i></i>AO VIVO</span>
  <h1>AXN HD</h1>
</header>

<div class="player loading" id="player" tabindex="0" aria-label="Player de vídeo">
  <video id="video" playsinline autoplay></video>

  <div class="overlay">
    <div class="spinner" aria-hidden="true"></div>
    <div class="msg" id="msg" role="alert">
      <span id="msgText">Não foi possível carregar o canal.</span><br>
      <button class="retry" id="retry">Tentar novamente</button>
    </div>
  </div>

  <div class="nowbar" id="nowbar"></div>

  <div class="castmsg" id="castmsg">
    <span id="castname">Transmitindo na TV</span>
    <button id="stopcast">Parar transmissão</button>
  </div>
  <button class="unmute" id="unmute">Ativar som</button>

  <div class="controls" id="controls">
    <button id="play" aria-label="Pausar"></button>
    <button id="mute" aria-label="Silenciar"></button>
    <input type="range" id="vol" min="0" max="1" step="0.02" value="1" aria-label="Volume">
    <button class="golive atlive" id="golive" aria-label="Ir para o ao vivo">AO VIVO</button>
    <span class="spacer"></span>
    <button id="cast" aria-label="Transmitir para a TV" style="display:none"></button>
    <select id="source" aria-label="Fonte">
      <option value="0">AXN HD</option>
      <option value="1">AXN SD</option>
      <option value="2">AXN RD</option>
    </select>
    <select id="speed" aria-label="Velocidade">
      <option value="0.5">0.5x</option>
      <option value="0.75">0.75x</option>
      <option value="1" selected>1x</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2x</option>
    </select>
    <select id="quality" aria-label="Qualidade"><option value="-1">Auto</option></select>
    <button id="pip" class="hide-sm" aria-label="Picture-in-picture"></button>
    <button id="fs" aria-label="Tela cheia"></button>
  </div>
</div>


<section class="epg" id="epg" hidden aria-label="Guia de programação">
  <span class="tag">AGORA</span>
  <h2 id="nowTitle"></h2>
  <div class="meta" id="nowTime"></div>
  <div class="bar"><i id="nowProg"></i></div>
  <p class="desc" id="nowDesc"></p>
  <h3 id="nextHead">A SEGUIR</h3>
  <ul id="epgList"></ul>
  <button class="more" id="epgMore">Ver programação completa</button>
  <p class="err" id="epgErr" hidden>Guia de programação indisponível no momento.</p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script>
(function(){
  // Fontes do canal: se a primeira falhar, o player troca sozinho para a próxima.
  const SOURCES = [
    "http://170.83.49.66:8083/AXNHD/index.m3u8",
    "http://170.83.16.50/AXN/index.m3u8", "https://rdcanais.net/axn"
  ];
  let srcIndex = 0, failovers = 0;
  const curSrc = () => SOURCES[srcIndex];

  // ===== EPG (guia de programação) =====
  // Cole aqui o link do guia no formato XMLTV (.xml ou .xml.gz) ou JSON.
  const EPG_URL = "";
  // Opcional: id do canal dentro do XMLTV. Vazio = procura sozinho um canal com "AXN" no nome.
  const EPG_CHANNEL = "";

  const $ = id => document.getElementById(id);
  const player=$("player"), video=$("video"), playBtn=$("play"), muteBtn=$("mute"), vol=$("vol"),
        qual=$("quality"), pipBtn=$("pip"), fsBtn=$("fs"), golive=$("golive"),
        msgText=$("msgText"), retry=$("retry");

  const ic = {
    play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
    vol:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>',
    mute:'<svg viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.5 2.5V12zM19 12a7 7 0 0 1-.9 3.4l1.5 1.5A9 9 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.2 4.2c-.7.5-1.4.9-2.2 1.1v2.1a9 9 0 0 0 3.6-1.8l2.1 2.1 1.3-1.3L4.3 3zM12 4 9.9 6.1 12 8.2V4z"/></svg>',
    pip:'<svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V5a2 2 0 0 0-2-2H3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2zm-2 .02H3V4.98h18v14.04z"/></svg>',
    fs:'<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>'
  };
  playBtn.innerHTML=ic.pause; muteBtn.innerHTML=ic.vol; pipBtn.innerHTML=ic.pip; fsBtn.innerHTML=ic.fs;

  let hls=null, idleTimer=null, retries=0;

  function setState(s){
    player.classList.toggle("loading", s==="loading");
    player.classList.toggle("error", s==="error");
  }

  function showError(text){
    msgText.textContent=text; setState("error");
  }

  const srcSel=document.getElementById("source");
  function nextSource(){
    if(failovers>=SOURCES.length-1) return false;
    failovers++;
    srcIndex=(srcIndex+1)%SOURCES.length;
    srcSel.value=String(srcIndex);
    load();
    return true;
  }
  srcSel.onchange=()=>{ srcIndex=+srcSel.value; failovers=0; load(); };

  function load(){
    retries=0; setState("loading");
    if(hls){hls.destroy();hls=null}

    if(window.Hls && Hls.isSupported()){
      hls = new Hls({
        lowLatencyMode:true,
        liveSyncDurationCount:3,
        maxBufferLength:30,
        manifestLoadingMaxRetry:4,
        levelLoadingMaxRetry:4,
        fragLoadingMaxRetry:6
      });
      hls.loadSource(curSrc());
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED,(e,d)=>{
        qual.innerHTML='<option value="-1">Auto</option>';
        d.levels.forEach((l,i)=>{
          const o=document.createElement("option");
          o.value=i; o.textContent=l.height?l.height+"p":Math.round(l.bitrate/1000)+" kbps";
          qual.appendChild(o);
        });
        qual.style.display = d.levels.length>1 ? "" : "none";
        tryAutoplay();
      });

      hls.on(Hls.Events.ERROR,(e,data)=>{
        if(!data.fatal) return;
        if(data.type===Hls.ErrorTypes.NETWORK_ERROR && retries<3){
          retries++; setTimeout(()=>hls&&hls.startLoad(),1500*retries);
        }else if(data.type===Hls.ErrorTypes.MEDIA_ERROR && retries<3){
          retries++; hls.recoverMediaError();
        }else if(nextSource()){
          return;
        }else{
          showError(data.type===Hls.ErrorTypes.NETWORK_ERROR
            ? "Sem conexão com o canal. Verifique se o servidor está no ar e permite acesso (CORS)."
            : "Erro ao reproduzir o canal.");
        }
      });
    }else if(video.canPlayType("application/vnd.apple.mpegurl")){
      video.src=curSrc();
      video.addEventListener("loadedmetadata",tryAutoplay,{once:true});
      video.addEventListener("error",()=>{ if(!nextSource()) showError("Não foi possível carregar o canal."); },{once:true});
    }else{
      showError("Este navegador não suporta HLS.");
    }
  }

  // Autoplay: tenta com som; se o navegador bloquear, tenta mudo; se falhar, usa o play de baixo
  const unmuteBtn=$("unmute");
  function tryAutoplay(){
    video.muted=false;
    video.play().catch(()=>{
      video.muted=true;
      video.play().then(()=>unmuteBtn.classList.add("show")).catch(()=>{});
    });
  }
  unmuteBtn.onclick=()=>{video.muted=false;if(video.volume===0)video.volume=1;unmuteBtn.classList.remove("show")};

  // Estado do vídeo
  video.addEventListener("playing",()=>{failovers=0;setState("");player.classList.add("playing");playBtn.innerHTML=ic.pause;retries=0});
  video.addEventListener("pause",()=>{player.classList.remove("playing");playBtn.innerHTML=ic.play});
  video.addEventListener("waiting",()=>setState("loading"));
  video.addEventListener("canplay",()=>{ if(!player.classList.contains("error")) setState("") });

  // Controles
  const toggle=()=>video.paused?video.play():video.pause();
  playBtn.onclick=toggle;
  video.onclick=toggle;
  video.ondblclick=()=>fsBtn.click();

  function syncVol(){
    vol.value=video.muted?0:video.volume;
    vol.style.setProperty("--v",(vol.value*100)+"%");
    muteBtn.innerHTML=(video.muted||video.volume===0)?ic.mute:ic.vol;
  }
  muteBtn.onclick=()=>{video.muted=!video.muted;syncVol()};
  vol.oninput=()=>{video.volume=+vol.value;video.muted=+vol.value===0;syncVol()};
  video.addEventListener("volumechange",()=>{syncVol();if(!video.muted)unmuteBtn.classList.remove("show")});

  qual.onchange=()=>{ if(hls) hls.currentLevel=+qual.value };

  // Velocidade de reprodução
  const speed=$("speed");
  speed.onchange=()=>{ video.playbackRate=+speed.value };
  video.addEventListener("loadedmetadata",()=>{ video.playbackRate=+speed.value });
  video.addEventListener("ratechange",()=>{ speed.value=String(video.playbackRate) });

  fsBtn.onclick=()=>{
    if(document.fullscreenElement||document.webkitFullscreenElement){
      (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    }else if(player.requestFullscreen){
      player.requestFullscreen().then(()=>{
        // Gira para a horizontal ao entrar em tela cheia
        if(screen.orientation && screen.orientation.lock){
          screen.orientation.lock("landscape").catch(()=>{});
        }
      }).catch(()=>{});
    }else if(video.webkitEnterFullscreen){ video.webkitEnterFullscreen() }
  };
  document.addEventListener("fullscreenchange",()=>{
    if(!document.fullscreenElement && screen.orientation && screen.orientation.unlock){
      try{ screen.orientation.unlock() }catch(e){}
    }
  });

  if(document.pictureInPictureEnabled){
    pipBtn.onclick=()=>document.pictureInPictureElement?document.exitPictureInPicture():video.requestPictureInPicture();
  }else{ pipBtn.style.display="none" }

  // Ao vivo
  function liveEdge(){
    if(hls && hls.liveSyncPosition) return hls.liveSyncPosition;
    const r=video.seekable; return r.length? r.end(r.length-1) : 0;
  }
  golive.onclick=()=>{video.currentTime=liveEdge();video.play().catch(()=>{})};
  setInterval(()=>{
    const behind=liveEdge()-video.currentTime;
    golive.classList.toggle("atlive", behind<8);
  },1000);

  retry.onclick=load;

  // Controles somem quando parado o mouse
  function wake(){
    player.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer=setTimeout(()=>player.classList.add("idle"),2800);
  }
  ["mousemove","touchstart","keydown"].forEach(ev=>player.addEventListener(ev,wake,{passive:true}));
  wake();

  // Atalhos
  document.addEventListener("keydown",e=>{
    if(["INPUT","SELECT"].includes(document.activeElement.tagName) && e.key!=="f" && e.key!=="m") return;
    const k=e.key.toLowerCase();
    if(k===" "||k==="k"){e.preventDefault();toggle()}
    else if(k==="m"){muteBtn.click()}
    else if(k==="f"){fsBtn.click()}
    else if(e.key==="ArrowUp"){e.preventDefault();video.volume=Math.min(1,video.volume+.05);video.muted=false}
    else if(e.key==="ArrowDown"){e.preventDefault();video.volume=Math.max(0,video.volume-.05)}
  });

  // ===== Transmissão para TV (Chromecast e AirPlay) =====
  const castBtn=$("cast"), castMsg=$("castmsg"), castName=$("castname"), stopCast=$("stopcast");
  castBtn.innerHTML='<svg viewBox="0 0 24 24"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>';
  let castReady=false, airplayReady=false;

  function updateCastBtn(){ castBtn.style.display=(castReady||airplayReady)?"":"none"; }

  window["__onGCastApiAvailable"]=function(ok){
    if(!ok) return;
    try{
      const ctx=cast.framework.CastContext.getInstance();
      ctx.setOptions({
        receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
      });
      castReady=true; updateCastBtn();

      ctx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED,e=>{
        const S=cast.framework.SessionState;
        if(e.sessionState===S.SESSION_STARTED||e.sessionState===S.SESSION_RESUMED){
          const sess=ctx.getCurrentSession();
          const dev=sess&&sess.getCastDevice?sess.getCastDevice().friendlyName:"";
          castName.textContent="Transmitindo para "+(dev||"a TV");
          player.classList.add("casting"); castBtn.classList.add("on");
          video.pause();
          const media=new chrome.cast.media.MediaInfo(curSrc(),"application/x-mpegURL");
          media.streamType=chrome.cast.media.StreamType.LIVE;
          media.metadata=new chrome.cast.media.GenericMediaMetadata();
          media.metadata.title="AXN HD";
          const req=new chrome.cast.media.LoadRequest(media);
          req.autoplay=true;
          sess.loadMedia(req).catch(()=>{
            castName.textContent="A TV não conseguiu abrir o canal.";
          });
        }else if(e.sessionState===S.SESSION_ENDED){
          player.classList.remove("casting"); castBtn.classList.remove("on");
          video.play().catch(()=>{});
        }
      });
    }catch(err){}
  };

  // AirPlay (Safari / iPhone)
  if(window.WebKitPlaybackTargetAvailabilityEvent){
    video.addEventListener("webkitplaybacktargetavailabilitychanged",e=>{
      airplayReady=(e.availability==="available"); updateCastBtn();
    });
  }

  castBtn.onclick=()=>{
    if(castReady){
      cast.framework.CastContext.getInstance().requestSession().catch(()=>{});
    }else if(airplayReady && video.webkitShowPlaybackTargetPicker){
      video.webkitShowPlaybackTargetPicker();
    }
  };
  stopCast.onclick=()=>{
    try{ cast.framework.CastContext.getInstance().endCurrentSession(true) }catch(e){}
  };

  // ===== EPG =====
  const epgBox=$("epg"), nowBar=$("nowbar");
  let epgData=[], epgExpanded=false;

  const fmtT=ms=>new Date(ms).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});

  function parseXmltvTime(t){
    const m=(t||"").match(/(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\s*([+-]\d{4})?/);
    if(!m) return null;
    const tz=m[7]?m[7].slice(0,3)+":"+m[7].slice(3):"Z";
    return new Date(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}${tz}`).getTime();
  }

  async function getText(url){
    const r=await fetch(url);
    if(!r.ok) throw new Error("http "+r.status);
    if(/\.gz(\?|$)/i.test(url) && window.DecompressionStream){
      return await new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).text();
    }
    return await r.text();
  }

  function parseEpg(text){
    const t=text.trim();
    if(t[0]==="[" || t[0]==="{"){
      let arr=JSON.parse(t); if(!Array.isArray(arr)) arr=arr.programmes||arr.programs||[];
      return arr.map(p=>({
        start:new Date(p.start).getTime(), stop:new Date(p.stop||p.end).getTime(),
        title:p.title||p.name||"", desc:p.desc||p.description||""
      })).filter(p=>p.start&&p.stop);
    }
    const xml=new DOMParser().parseFromString(t,"text/xml");
    let ch=EPG_CHANNEL;
    if(!ch){
      for(const c of xml.getElementsByTagName("channel")){
        const names=[...c.getElementsByTagName("display-name")].map(n=>n.textContent).join(" ");
        if(/axn/i.test(names+" "+c.getAttribute("id"))){ ch=c.getAttribute("id"); break; }
      }
    }
    const out=[];
    for(const pr of xml.getElementsByTagName("programme")){
      if(ch && pr.getAttribute("channel")!==ch) continue;
      const q=n=>{const e=pr.getElementsByTagName(n)[0];return e?e.textContent.trim():""};
      const start=parseXmltvTime(pr.getAttribute("start")), stop=parseXmltvTime(pr.getAttribute("stop"));
      if(start&&stop) out.push({start,stop,title:q("title"),desc:q("desc")});
    }
    return out;
  }

  function renderEpg(){
    if(!epgData.length) return;
    const now=Date.now();
    let idx=epgData.findIndex(p=>p.start<=now&&now<p.stop);
    const cur=idx>=0?epgData[idx]:null;
    const upcoming=epgData.filter(p=>p.start>now);

    if(cur){
      $("nowTitle").textContent=cur.title;
      $("nowTime").textContent=fmtT(cur.start)+" – "+fmtT(cur.stop);
      $("nowProg").style.width=Math.min(100,Math.max(0,(now-cur.start)/(cur.stop-cur.start)*100))+"%";
      $("nowDesc").textContent=cur.desc;
      nowBar.innerHTML="<b>AGORA</b>"+cur.title.replace(/</g,"&lt;");
      nowBar.classList.add("show");
    }else{
      $("nowTitle").textContent="Programação indisponível agora";
      $("nowTime").textContent=""; $("nowProg").style.width="0"; $("nowDesc").textContent="";
      nowBar.classList.remove("show");
    }

    const limit=now+36*3600*1000;
    const list=epgExpanded?upcoming.filter(p=>p.start<limit):upcoming.slice(0,4);
    $("epgList").innerHTML=list.map(p=>
      `<li><time>${fmtT(p.start)}</time><span>${p.title.replace(/</g,"&lt;")}</span></li>`).join("");
    $("nextHead").style.display=list.length?"":"none";
    $("epgMore").style.display=upcoming.length>4?"":"none";
    $("epgMore").textContent=epgExpanded?"Mostrar menos":"Ver programação completa";
    epgBox.hidden=false; $("epgErr").hidden=true;
  }

  $("epgMore").onclick=()=>{epgExpanded=!epgExpanded;renderEpg()};

  async function loadEpg(){
    if(!EPG_URL) return;
    try{
      epgData=parseEpg(await getText(EPG_URL)).sort((a,b)=>a.start-b.start);
      if(!epgData.length) throw new Error("vazio");
      renderEpg();
    }catch(e){
      epgBox.hidden=false;
      ["nowTitle","nowTime","nowDesc","nextHead","epgList","epgMore"].forEach(i=>$(i).style.display="none");
      document.querySelector("#epg .tag").style.display="none";
      document.querySelector("#epg .bar").style.display="none";
      $("epgErr").hidden=false;
    }
  }
  loadEpg();
  setInterval(renderEpg,30000);
  setInterval(loadEpg,6*3600*1000);

  syncVol();
  load();
})();
</script>
